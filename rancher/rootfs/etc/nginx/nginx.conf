user nginx;
worker_processes auto;
error_log /dev/stdout info;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default Upgrade;
        '' close;
    }

    # HA Ingress talks HTTP to this nginx, but the browser used HTTPS.
    # X-Forwarded-Proto: https stops rancher/rancher from redirecting to :443.
    map $http_x_forwarded_proto $rancher_forwarded_proto {
        default https;
        http http;
        https https;
    }

    map $http_x_forwarded_port $rancher_forwarded_port {
        "" 443;
        default $http_x_forwarded_port;
    }

    include /etc/nginx/http.d/*.conf;
}
