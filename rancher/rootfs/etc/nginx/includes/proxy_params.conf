# Headers required when TLS is terminated in front of rancher/rancher
# (HA Ingress = layer-7 proxy). See:
# https://ranchermanager.docs.rancher.com/v2.15/how-to-guides/advanced-user-guides/configure-layer-7-nginx-load-balancer
proxy_http_version 1.1;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $rancher_forwarded_proto;
proxy_set_header X-Forwarded-Port $rancher_forwarded_port;
proxy_set_header X-Ingress-Path $http_x_ingress_path;
# Shell/exec windows need a long timeout (Rancher docs use 900s).
proxy_read_timeout 900s;
proxy_send_timeout 900s;
proxy_buffering off;
