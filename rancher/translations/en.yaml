configuration:
  log_level:
    name: Log level
    description: Reserved for future use; Rancher logs go to the app log stream.
  bootstrap_password:
    name: Bootstrap password
    description: Initial password for the Rancher admin user. Leave empty to auto-generate.
  server_url:
    name: Server URL
    description: External URL Rancher should advertise. Set when using Ingress or a reverse proxy.
  reset_data:
    name: Reset Rancher data
    description: Wipe the Rancher data volume on the next start. The app turns this off automatically after the wipe.
  k3s_haos_compat:
    name: HAOS k3s compatibility
    description: Set CONTAINERD_SNAPSHOTTER=native so embedded k3s can run on HAOS storage. Disable only for debugging.
network:
  80/TCP: Rancher HTTP (optional direct access)
  443/TCP: Rancher HTTPS (optional direct access)
