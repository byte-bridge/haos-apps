# https://developers.home-assistant.io/docs/apps/configuration
name: Rancher
version: "2.0.1"
slug: rancher
description: >-
  Rancher Kubernetes management platform. Runs the official rancher/rancher
  image with a thin Home Assistant Ingress wrapper.
url: "https://github.com/byte-bridge/haos-apps/tree/main/rancher"
arch:
  - aarch64
  - amd64
startup: services
init: false
advanced: true
stage: experimental
panel_icon: mdi:kubernetes
panel_title: Rancher
ingress: true
ingress_port: 8099
ingress_stream: true
hassio_api: true
hassio_role: manager
full_access: true
map:
  - type: addon_config
    read_only: false
ports:
  80/tcp: null
  443/tcp: null
ports_description:
  80/tcp: Rancher HTTP (optional direct access)
  443/tcp: Rancher HTTPS (optional direct access)
watchdog: "http://[HOST]:[PORT:8099]/"
options:
  log_level: info
  bootstrap_password: ""
  server_url: ""
  reset_data: false
  k3s_haos_compat: true
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  bootstrap_password: password?
  server_url: url?
  reset_data: bool
  k3s_haos_compat: bool
